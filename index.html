

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="header">
            <div class="icon">
                <svg viewBox="0 0 64 64" width="65" height="65"
                    fill="none" stroke="currentColor"
                    stroke-width="3.5" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M14 7h28l10 10v39H14z"/>
                    <path d="M42 7v12h10"/>
                    <path d="M23 27h20"/>
                    <path d="M23 37h20"/>
                    <path d="M23 47h14"/>
                </svg>
            </div>

            <h1>Character Counter</h1>
        </div>

        <textarea
            id="textInput"
            maxlength="200"
            placeholder="Enter your text here..."
        ></textarea>

        <div class="counter">
            <p>
                Characters:
                <span id="count">0</span> / 200
            </p>

            <p>
                Remaining:
                <span id="remaining">200</span>
            </p>
        </div>

        <p id="warning" role="status" aria-live="polite"></p>

        <button id="clearBtn" type="button">
            Clear Text
        </button>

    </div>

    <script src="script.js"></script>
</body>
</html>
